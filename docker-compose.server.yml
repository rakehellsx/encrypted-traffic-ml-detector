services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: encrypted-traffic-ml-detector:latest
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://trafficguard:${MARIADB_PASSWORD}@mariadb:3306/trafficguard
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: trafficguard
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OWNER_OPEN_ID: trafficguard_public_workspace
    ports:
      - "3001:3001"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - trafficguard

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: trafficguard
      MARIADB_USER: trafficguard
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - trafficguard

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - trafficguard

volumes:
  mariadb_data:
  minio_data:

networks:
  trafficguard:
    driver: bridge
